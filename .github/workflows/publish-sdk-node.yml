# Tests the Node SDK on every change. Publishes to npm when you push a tag like sdk-node-v0.1.0, or when you run it
# by hand from main with "publish" ticked (it then tags the release sdk-node-v<version> itself).
# Publishing needs one repository secret: NPM_TOKEN (npmjs.com → Access Tokens → Granular, publish rights for "delivrie").
name: Node SDK

on:
  push:
    branches: [main]
    paths: ["sdk/node/**", ".github/workflows/publish-sdk-node.yml"]
    tags: ["sdk-node-v*"]
  pull_request:
    paths: ["sdk/node/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in sdk/node/package.json to npm
        type: boolean
        default: false
      inspect:
        description: Only show the package's npm status and staged versions
        type: boolean
        default: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npx -y npm@latest --version
      - run: npx -y npm@latest whoami || true
      - run: npx -y npm@latest view delivrie versions dist-tags maintainers --json || true
      - run: npx -y npm@latest stage list delivrie || true

  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.inspect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g typescript@6.0.3
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/sdk-node-v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag the release on manual runs
      id-token: write # npm provenance: links the package to this repo and commit
    defaults:
      run:
        working-directory: sdk/node
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check token and version
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::Add the NPM_TOKEN repository secret to publish."; exit 1; fi
          pkg="$(node -p 'require("./package.json").version')"
          src="$(grep -oE 'VERSION = "[^"]+"' src/client.ts | cut -d'"' -f2)"
          tag="$pkg"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="${GITHUB_REF_NAME#sdk-node-v}"; fi
          if [ "$tag" != "$pkg" ] || [ "$pkg" != "$src" ]; then
            echo "::error::Tag $tag, package.json $pkg and VERSION in src/client.ts $src must match."; exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"
          if npm view "delivrie@$pkg" version >/dev/null 2>&1; then
            echo "::notice::delivrie@$pkg is already on npm, so this run only makes sure the release is tagged. Bump the version to publish again."
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
          fi
      - if: env.ALREADY_PUBLISHED != '1'
        run: npm install -g typescript@6.0.3
      - if: env.ALREADY_PUBLISHED != '1'
        run: npm run build
      - if: env.ALREADY_PUBLISHED != '1'
        run: npx -y npm@latest publish --access public --provenance
      - name: Check it's live
        if: env.ALREADY_PUBLISHED != '1'
        run: |
          # New versions can take a few minutes to show up on the registry.
          for i in $(seq 1 36); do
            if npx -y npm@latest view "delivrie@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then echo "delivrie@$VERSION is live"; exit 0; fi
            sleep 10
          done
          npx -y npm@latest stage list delivrie || true
          echo "::error::delivrie@$VERSION isn't on the registry. If it's staged, approve it on npmjs.com."; exit 1
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          if git ls-remote --exit-code --tags origin "sdk-node-v$VERSION" >/dev/null; then echo "Tag already exists"; exit 0; fi
          git tag "sdk-node-v$VERSION"
          git push origin "sdk-node-v$VERSION"
