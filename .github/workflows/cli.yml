# Builds (TypeScript → dist/) and tests the CLI (sdk/cli) on every change. Publishing to npm (package "delivrie-cli") is a manual run with
# "publish" ticked; it needs the NPM_TOKEN repository secret, the same one the Node SDK uses.
name: CLI

on:
  push:
    branches: [main]
    paths: ["sdk/cli/**", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["sdk/cli/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in sdk/cli/package.json to npm
        type: boolean
        default: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    defaults:
      run:
        working-directory: sdk/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node bin/delivrie.js --version

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: sdk/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - name: Publish (skipped if this version is already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "delivrie-cli@$v" version >/dev/null 2>&1; then echo "delivrie-cli@$v is already public"; exit 0; fi
          npx -y npm@latest publish --provenance --access public || echo "::warning::publish returned an error; if this version is already staged, approve it on npmjs.com"
      - name: Check it's live
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 18); do npm view "delivrie-cli@$v" version 2>/dev/null | grep -qx "$v" && { echo "delivrie-cli@$v is live"; exit 0; }; sleep 10; done
          npx -y npm@latest stage list delivrie-cli || true
          echo "::warning::delivrie-cli@$v isn't public yet. If it's staged, approve it on npmjs.com (Packages → delivrie-cli)."
      - name: Tag the release
        run: |
          v=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "cli-v$v" >/dev/null; then echo "cli-v$v already tagged"; else git tag "cli-v$v" && git push origin "cli-v$v"; fi
