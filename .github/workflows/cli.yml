# Tests the CLI (sdk/cli) on every change. Publishing to npm (package "delivrie-cli") is a manual run with
# "publish" ticked; it needs the NPM_TOKEN repository secret, the same one the Node SDK uses.
name: CLI

on:
  push:
    branches: [main]
    paths: ["sdk/cli/**", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["sdk/cli/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in sdk/cli/package.json to npm
        type: boolean
        default: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    defaults:
      run:
        working-directory: sdk/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/delivrie.js --version

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: sdk/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag the release
        run: |
          v=$(node -p "require('./package.json').version")
          git tag "cli-v$v" && git push origin "cli-v$v"
