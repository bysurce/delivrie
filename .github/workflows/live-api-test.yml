# Sends real emails to Delivrie's test addresses after every API deploy (and once a day) to prove sending,
# idempotent retries, Resend SDK compatibility, the CLI and the Go, PHP, Ruby and Java SDKs work end to end. See tools/live-test.mjs.
# Needs one repository secret: DELIVRIE_TEST_KEY (a sending access key). About 12 emails per run.
name: Live API test

on:
  workflow_run:
    workflows: ["Deploy Supabase functions"]
    types: [completed]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency: live-api-test

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DELIVRIE_TEST_KEY: ${{ secrets.DELIVRIE_TEST_KEY }}
      RESEND_BASE_URL: https://delivrie.io/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the published SDKs
        run: npm install --no-save --prefix tools delivrie@latest resend@latest
      - name: Build the CLI (TypeScript → dist/)
        working-directory: sdk/cli
        run: npm install --no-audit --no-fund && npm run build
      - name: Run the live test (Node SDK, Resend SDK, CLI)
        run: node tools/live-test.mjs
      - uses: actions/setup-go@v5
        if: always()
        with:
          go-version: stable
          cache: false
      - name: Go SDK against the live API
        if: always()
        working-directory: sdk/go
        run: go test -count=1 -run TestLive -v ./...
      - name: PHP SDK against the live API
        if: always()
        working-directory: sdk/php
        run: php tests/live.php
      - name: Ruby SDK against the live API
        if: always()
        working-directory: sdk/ruby
        run: ruby -Ilib test/live.rb
      - name: Java SDK against the live API
        if: always()
        working-directory: sdk/java
        run: |
          mkdir -p target/classes target/test-classes
          javac -d target/classes $(find src/main -name '*.java')
          javac -d target/test-classes -cp target/classes src/test/java/io/delivrie/LiveTest.java
          java -cp target/classes:target/test-classes io.delivrie.LiveTest
