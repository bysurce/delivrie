# Tests the PHP SDK (sdk/php) on every change.
# Publishing: Packagist reads composer.json from a repository's root, so the SDK is mirrored to its own repository
# (codeddesigner/delivrie-php) by the "split" job. It runs only when the SPLIT_TOKEN secret exists (a GitHub token
# with write access to that repository); then a tag like php-v0.1.0 here becomes v0.1.0 there and on Packagist.
name: PHP SDK

on:
  push:
    branches: [main]
    paths: ["sdk/php/**", ".github/workflows/sdk-php.yml"]
    tags: ["php-v*"]
  pull_request:
    paths: ["sdk/php/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --strict
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php

  split:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror sdk/php to codeddesigner/delivrie-php
        if: env.SPLIT_TOKEN != ''
        run: |
          git subtree split --prefix=sdk/php -b php-split
          git push "https://x-access-token:${SPLIT_TOKEN}@github.com/codeddesigner/delivrie-php.git" php-split:main --force
          if [[ "$GITHUB_REF" == refs/tags/php-v* ]]; then
            v="${GITHUB_REF#refs/tags/php-}"
            git tag "$v" php-split
            git push "https://x-access-token:${SPLIT_TOKEN}@github.com/codeddesigner/delivrie-php.git" "$v"
          fi
      - if: env.SPLIT_TOKEN == ''
        run: echo "::notice::SPLIT_TOKEN isn't set, so sdk/php wasn't mirrored for Packagist."
